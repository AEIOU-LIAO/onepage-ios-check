name: iPhone（WebKit）检查
# 手动触发：Actions 页面 → 选这个工作流 → Run workflow。
# 另外，改动 run-request.txt 并推送也会跑一次（方便不进网页也能触发）。其他推送都不会跑。
on:
  workflow_dispatch:
    inputs:
      site:
        description: 要检查的网址
        default: https://tools.peiqi1.top/
        required: true
  push:
    branches: [main]
    paths: [run-request.txt]
concurrency: { group: ios-check, cancel-in-progress: true }
permissions:
  contents: write        # 只用来把结果（报告和截图）更新到 results 分支
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install webkit
      - name: 跑检查
        env:
          SITE: ${{ inputs.site || 'https://tools.peiqi1.top/' }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}
        run: npx playwright test
      - name: 读网站的响应头（公开信息，不涉及账号）
        if: always()
        env:
          SITE: ${{ inputs.site || 'https://tools.peiqi1.top/' }}
        run: |
          { echo "# 响应头"; for p in "" "app.js" "style.css" "api/ping" "api/auth/status"; do echo; echo "## /$p"; echo '```'; curl -sS -m 20 -D - -o /dev/null "${SITE%/}/$p" | grep -iE "^(HTTP/|content-security-policy|x-frame-options|x-content-type-options|strict-transport-security|referrer-policy|permissions-policy|cross-origin-|cache-control|content-type)" || echo "（没读到）"; echo '```'; done; } > headers.md
      - name: 保存报告和截图
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: ios-check, path: "report.md\nheaders.md\nshots/", retention-days: 14 }
      - name: 把结果更新到 results 分支（只保留最近一次）
        if: always()
        run: |
          mkdir out && cp -r report.md headers.md shots out/ 2>/dev/null || true
          cd out && git init -q -b results
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "检查结果 $(date -u +%FT%TZ)（运行 #${{ github.run_number }}）"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" results
