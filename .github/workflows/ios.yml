name: iPhone（WebKit）检查
run-name: OnePage WebKit · ${{ inputs.suite }}

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 小版本 smoke / 大版本 release（包含小版本）
        type: choice
        options:
          - smoke
          - release
        default: smoke
        required: true

concurrency:
  group: ios-check

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npx playwright install webkit
      - name: 跑检查
        env:
          QA_SUITE: ${{ inputs.suite }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}
        run: |
          case "$QA_SUITE" in
            smoke) npm test -- --grep @smoke ;;
            release) npm test ;;
            *) echo '未识别的测试档位'; exit 2 ;;
          esac
